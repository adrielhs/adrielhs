<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Breach // Cassino Reverso Harmonic Signal Synchronization</title>
  <style>
    :root {
      --bg: #030305;
      --panel: #0A0B10;
      --panel-elevated: #11131B;
      --amber: #D4AF37;
      --amber-dim: rgba(212, 175, 55, 0.15);
      --ivory: #F5F0E8;
      --crimson: #8C1D18;
      --crimson-dim: rgba(140, 29, 24, 0.2);

      --text: #E0E7FF;
      --border: #1E293B;

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-mono);
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      user-select: none;
    }
    .game-container {
      width: 100%;
      max-width: 900px;
      background: var(--panel);
      border: 1px solid var(--amber);
      padding: 28px 24px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.85);
      position: relative;
    }
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .brand-title {
      color: var(--amber);
      font-size: 1.1rem;
      letter-spacing: 3px;
      font-weight: bold;
    }
    .brand-sub {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 2px;
    }
    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
      background: var(--panel-elevated);
      border: 1px solid var(--border);
      padding: 10px 16px;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
    }
    .hud-label {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: var(--amber);

      width: 8px;

      border-radius: 1px;
      transition: height 0.08s ease;
      opacity: 0.7;

    .wave-bar.active {

      background: var(--ivory);

    .status-banner {

      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;

    .terminals-grid {

      gap: 12px;
      margin-bottom: 20px;

    @media (max-width: 680px) {
      .terminals-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      background: #070912;
      border: 1px solid var(--border);

      border-color: var(--crimson) !important;
      border-top-color: var(--crimson) !important;
      box-shadow: 0 0 16px rgba(140, 29, 24, 0.6);
    }
    .terminal-glyph {
      font-size: 1.2rem;
      color: var(--amber);
      margin-bottom: 6px;
    }
    .terminal-name {
      font-size: 0.78rem;
      font-weight: bold;

      letter-spacing: 1.5px;
      margin-bottom: 2px;

    .terminal-freq {

      color: var(--muted);
      letter-spacing: 1px;
    }
    .terminal-hotkey {
      position: absolute;
      top: 4px;
      right: 6px;

      color: var(--muted);
    }
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      border-top: 1px solid var(--border);
    }
    .btn {
      background: transparent;
      border: 1px solid var(--amber);
      color: var(--amber);
      padding: 10px 22px;
      font-size: 0.8rem;
      letter-spacing: 2px;

    }
    .btn-crimson:hover {

    .screen {

<body>

<div class="game-container" id="app"></div>

<script>
// --- Web Audio API Synthesizer ---
class AudioBreachSynthesizer {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, duration = 0.45, type = 'sine', volume = 0.12) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(volume, this.ctx.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }
  successChime() {
    [440, 554.37, 659.25, 880].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 0.2, 'sine', 0.08), i * 75);
    });
  }
  errorBuzz() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.35);
    } catch (e) {}
  }
}
const synth = new AudioBreachSynthesizer();

// --- 5 Curated Frequency Terminals ---
const TERMINALS = [
  { id: 0, code: 'NODE 01', label: 'ALPHA',   freq: 220,    note: 'A3',  glyph: '∿' },
  { id: 1, code: 'NODE 02', label: 'BETA',    freq: 294,    note: 'D4',  glyph: '≋' },
  { id: 2, code: 'NODE 03', label: 'GAMMA',   freq: 330,    note: 'E4',  glyph: '⍾' },
  { id: 3, code: 'NODE 04', label: 'DELTA',   freq: 440,    note: 'A4',  glyph: '⌖' },
  { id: 4, code: 'NODE 05', label: 'EPSILON', freq: 554,    note: 'C#5', glyph: '⌬' }
];

// --- 5 Progressive Rounds: 3 to 7 tone sequence length ---
const ROUND_LENGTHS = [3, 4, 5, 6, 7];
const TOTAL_ROUNDS = 5;

// --- Game State ---
let currentScreen = 'title'; // 'title' | 'play' | 'summary'
let roundIndex = 0;
let score = 0;
let sequence = [];
let playerInputs = [];
let isPlayingSequence = false;
let roundHistory = [];
let animVisualizerId = null;

function app() { return document.getElementById('app'); }

function render() {
  if (currentScreen === 'title') renderTitle();
  else if (currentScreen === 'play') renderPlay();
  else if (currentScreen === 'summary') renderSummary();
}

function renderTitle() {
  app().innerHTML = `
    <div class="brand-header">
      <div class="brand-title">CASSINO REVERSO // AUDIO BREACH</div>
      <div class="brand-sub">HARMONIC SIGNAL SYNCHRONIZER</div>
    </div>
    <div class="screen">
      <h2>◼ ACOUSTIC CRYPTOGRAPHIC PROTOCOL</h2>
      <p>Synchronize harmonic transmission sequences to unlock the encrypted partitions of <strong>Cassino Reverso</strong>. Synthesized purely in real-time via the Web Audio API.</p>

      <div class="briefing-box">
        <strong>OPERATION PROTOCOL:</strong><br>
        1. Click "[ INITIALIZE AUDIO BREACH → ]" to activate the Web Audio engine.<br>
        2. In each cycle, listen to the acoustic sequence transmitted across <strong>5 frequency terminals</strong>:<br>
           &nbsp;&nbsp;• <strong>ALPHA (220 Hz)</strong> · <strong>BETA (294 Hz)</strong> · <strong>GAMMA (330 Hz)</strong> · <strong>DELTA (440 Hz)</strong> · <strong>EPSILON (554 Hz)</strong><br>
        3. Replicate the frequency sequence in identical order using mouse clicks or keyboard hotkeys <strong>[1–5]</strong>.<br>
        4. Complexity scales progressively across 5 cycles: <strong>3 → 4 → 5 → 6 → 7 tones</strong>.<br>
        5. Perfect sequence reproduction yields <strong>+100 points</strong> per cycle.
      </div>

      <button class="btn" onclick="startSession()">[ INITIALIZE AUDIO BREACH → ]</button>
    </div>
  `;
}

function startSession() {
  synth.init();
  synth.playTone(440, 0.1);
  roundIndex = 0;
  score = 0;
  roundHistory = [];
  currentScreen = 'play';
  startCycle();
}

function startCycle() {
  const seqLength = ROUND_LENGTHS[roundIndex];
  sequence = [];
  for (let i = 0; i < seqLength; i++) {
    sequence.push(Math.floor(Math.random() * TERMINALS.length));
  }
  playerInputs = [];
  isPlayingSequence = true;
  renderPlay();

  // Play the acoustic transmission sequence after short pause
  setTimeout(() => {
    transmitSequence();
  }, 600);
}

function transmitSequence() {
  isPlayingSequence = true;
  updateStatus('▶ TRANSMITTING CRYPTOGRAPHIC SIGNAL — LISTEN...', 'listen');
  disableTerminalButtons(true);

  sequence.forEach((terminalIdx, step) => {
    const delay = step * 620;
    setTimeout(() => {
      const term = TERMINALS[terminalIdx];
      synth.playTone(term.freq, 0.42, 'sine', 0.14);
      highlightTerminal(terminalIdx, 'lit-system', 400);
      triggerWaveBars();
    }, delay);
  });

  const totalTime = sequence.length * 620 + 250;
  setTimeout(() => {
    isPlayingSequence = false;
    disableTerminalButtons(false);
    updateStatus('◼ INPUT REQUIRED // REPLICATE FREQUENCY SEQUENCE', 'input');
  }, totalTime);
}

function handleTerminalClick(terminalIdx) {
  if (isPlayingSequence) return;
  synth.init();

  const term = TERMINALS[terminalIdx];
  synth.playTone(term.freq, 0.35, 'sine', 0.12);
  highlightTerminal(terminalIdx, 'lit-user', 220);
  triggerWaveBars();

  playerInputs.push(terminalIdx);
  const currentStep = playerInputs.length - 1;

  // Check if current input matches the sequence
  if (playerInputs[currentStep] !== sequence[currentStep]) {
    // Incorrect input
    synth.errorBuzz();
    highlightTerminal(terminalIdx, 'lit-error', 350);
    markPip(currentStep, 'failed');
    updateStatus('✗ FREQUENCY DESYNCHRONIZATION DETECTED // SEQUENCE REJECTED', 'error');
    isPlayingSequence = true;
    disableTerminalButtons(true);

    roundHistory.push({
      round: roundIndex + 1,
      tones: sequence.length,
      success: false,
      scoreAdded: 0
    });

    setTimeout(() => {
      proceedAfterCycle();
    }, 1400);
    return;
  }

  // Correct step
  markPip(currentStep, 'lit');

  // Check if sequence is complete
  if (playerInputs.length === sequence.length) {
    // Round succeeded!
    synth.successChime();
    const cycleScore = 100 + (roundIndex * 20);
    score += cycleScore;
    updateStatus(`✓ SIGNAL SYNCHRONIZED (+${cycleScore} PTS)`, 'success');
    updateHudScore();
    isPlayingSequence = true;
    disableTerminalButtons(true);

    roundHistory.push({
      round: roundIndex + 1,
      tones: sequence.length,
      success: true,
      scoreAdded: cycleScore
    });

    setTimeout(() => {
      proceedAfterCycle();
    }, 1300);
  }
}

function proceedAfterCycle() {
  if (roundIndex < TOTAL_ROUNDS - 1) {
    roundIndex++;
    startCycle();
  } else {
    currentScreen = 'summary';
    synth.successChime();
    render();
  }
}

function highlightTerminal(idx, className, duration) {
  const pad = document.getElementById(`term-${idx}`);
  if (pad) {
    pad.classList.add(className);
    setTimeout(() => {
      pad.classList.remove(className);
    }, duration);
  }
}

function markPip(stepIndex, className) {
  const pip = document.getElementById(`pip-${stepIndex}`);
  if (pip) {
    pip.className = `seq-pip ${className}`;
  }
}

function disableTerminalButtons(disabled) {
  const btns = document.querySelectorAll('.terminal-pad');
  btns.forEach(b => b.disabled = disabled);
}

function updateStatus(text, statusClass) {
  const banner = document.getElementById('statusBanner');
  if (banner) {
    banner.textContent = text;
    banner.className = `status-banner ${statusClass}`;
  }
}

function updateHudScore() {
  const scoreEl = document.getElementById('scoreVal');
  if (scoreEl) scoreEl.textContent = score;
}

function triggerWaveBars() {
  const bars = document.querySelectorAll('.wave-bar');
  bars.forEach(b => {
    const h = Math.round(8 + Math.random() * 48);
    b.style.height = `${h}px`;
    b.classList.add('active');
  });
  setTimeout(() => {
    bars.forEach(b => {
      b.style.height = '6px';
      b.classList.remove('active');
    });
  }, 220);
}

function renderPlay() {
  const seqLength = ROUND_LENGTHS[roundIndex];

  app().innerHTML = `
    <div class="brand-header">
      <div class="brand-title">CASSINO REVERSO // AUDIO BREACH</div>
      <div class="brand-sub">CYCLE: ${roundIndex + 1} / ${TOTAL_ROUNDS}</div>
    </div>

    <div class="hud">
      <div class="hud-stat">
        <span class="hud-label">Signal Cycle</span>
        <span class="hud-val">${roundIndex + 1} / ${TOTAL_ROUNDS}</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Sequence Length</span>
        <span class="hud-val">${seqLength} TONES</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Protocol Score</span>
        <span class="hud-val ivory" id="scoreVal">${score}</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Cassino Channel</span>
        <span class="hud-val ivory">ACTIVE</span>
      </div>
    </div>

    <div class="waveform-visualizer" id="waveVisualizer">
      ${Array.from({ length: 28 }, () => `<div class="wave-bar" style="height:6px;"></div>`).join('')}
    </div>

    <div class="status-banner listen" id="statusBanner">
      ▶ INITIALIZING SIGNAL TRANSMISSION...
    </div>

    <div class="pips-container">
      ${Array.from({ length: seqLength }, (_, i) => `
        <div class="seq-pip" id="pip-${i}"></div>
      `).join('')}
    </div>

    <div class="terminals-grid">
      ${TERMINALS.map((t, i) => `
        <button class="terminal-pad" id="term-${i}" onclick="handleTerminalClick(${i})">
          <div class="terminal-hotkey">[${i + 1}]</div>
          <div class="terminal-glyph">${t.glyph}</div>
          <div class="terminal-name">${t.label}</div>
          <div class="terminal-freq">${t.freq} Hz</div>
        </button>
      `).join('')}
    </div>

    <div class="controls-bar">
      <div style="font-size:0.75rem;color:var(--muted);letter-spacing:1px;">
        INPUT: CLICK TERMINALS OR USE KEYS [1–5]
      </div>
      <button class="btn btn-crimson" style="padding:6px 14px;font-size:0.7rem;" onclick="abortSession()">[ ABORT ]</button>
    </div>
  `;
}

function abortSession() {
  currentScreen = 'title';
  render();
}

function renderSummary() {
  const correctCycles = roundHistory.filter(h => h.success).length;
  if (correctCycles < 3) {
    triggerHackedByAdriel("COLAPSO HARMÔNICO FATAL // FALHA NA RECONSTITUIÇÃO DO SINAL DO CASSINO REVERSO", "startSession");
  } else {
    triggerHoneypotVictory("CHAVE MESTRA DO CASSINO REVERSO 2026", "Cassino Reverso // Plataforma Educacional", "https://cassino-reverso.vercel.app", "startSession");
  }
}

function renderSummaryOld() {
  const correctCycles = roundHistory.filter(h => h.success).length;
  const rank = correctCycles === 5
    ? 'CHIEF ACOUSTIC CRYPTOGRAPHER'
    : correctCycles >= 4
      ? 'CASSINO SIGNAL ARCHITECT'
      : correctCycles >= 2
        ? 'RESONANCE OPERATIONS SPECIALIST'
        : 'FREQUENCY APPRENTICE';

  app().innerHTML = `
    <div class="brand-header">
      <div class="brand-title">CASSINO REVERSO // BREACH COMPLETED</div>
      <div class="brand-sub">SIGNAL PARTITIONS AUDITED</div>
    </div>
    <div class="screen">
      <h2>◼ HARMONIC DECRYPTION COMPLETE</h2>
      <div class="score-banner">${score}</div>
      <p>5 progressive acoustic transmission cycles processed.<br>
      SYNCHRONIZATION RATIO: <strong style="color:var(--amber);">${correctCycles} / 5 CYCLES ACCURATE</strong>.<br>
      SECURITY CLEARANCE: <strong style="color:var(--ivory);">${rank}</strong>.</p>

      <div class="briefing-box" style="margin-bottom:24px;">
        <div style="font-weight:bold;color:var(--amber);margin-bottom:10px;letter-spacing:1.5px;text-align:center;">
          FREQUENCY TRANSMISSION CYCLE BREAKDOWN
        </div>
        ${roundHistory.map(h => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #141824;font-size:0.75rem;">
            <span style="color:var(--muted);">Cycle ${h.round} (${h.tones} Tones)</span>
            <strong style="color:${h.success ? 'var(--amber)' : 'var(--crimson)'};">
              ${h.success ? `✓ SYNCHRONIZED (+${h.scoreAdded} PTS)` : '✗ REJECTED (0 PTS)'}
            </strong>
          </div>
        `).join('')}
      </div>

      <p style="font-size:0.78rem;color:var(--muted);line-height:1.6;">
        Linked System: <strong>Cassino Reverso</strong> — educação financeira em uma experiência full-stack interativa.
      </p>

      <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px;">
        <button class="btn" onclick="startSession()">[ REINITIALIZE BREACH SIMULATION ]</button>
        <button class="btn btn-secondary" onclick="window.location.href='https://github.com/adrielhs'">[ RETURN TO PROFILE ]</button>
      </div>
    </div>
  `;
}

// Keyboard shortcuts for hotkeys 1, 2, 3, 4, 5
window.addEventListener('keydown', (e) => {
  if (currentScreen !== 'play' || isPlayingSequence) return;
  if (e.key === '1') handleTerminalClick(0);
  else if (e.key === '2') handleTerminalClick(1);
